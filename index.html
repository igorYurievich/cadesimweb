<!doctype html>

    <meta
      name="description"
      content="Dibuja y simula esquemas eléctricos en el navegador: contactores, relés, temporizadores, motores y PLC. Abre archivos .cad de CADe SIMU. Gratis, sin instalar, también sin conexión."
    />
    <meta name="author" content="Igor Lipskiy Vyatchin" />
    <meta name="theme-color" content="#16202b" />
    <link rel="canonical" href="https://cadesimweb.vercel.app/" />

    <link rel="icon" type="image/png" sizes="32x32" href="./pwa/favicon-32.png" />
    <link rel="apple-touch-icon" href="./pwa/apple-touch-icon.png" />
    <!-- Превью ссылки в мессенджерах и соцсетях (Open Graph / Twitter) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Web Cade" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:url" content="https://cadesimweb.vercel.app/" />
    <meta property="og:title" content="Web Cade: simulador de esquemas eléctricos online" />
    <meta
      property="og:description"
      content="Editor y simulador de esquemas eléctricos y lógica de relés en el navegador. Compatible con archivos .cad de CADe SIMU."

        "inLanguage": ["es", "en", "fr", "it", "ru"],
